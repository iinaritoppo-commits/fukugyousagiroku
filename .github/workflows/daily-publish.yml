name: Daily Auto-Publish (08:00 & 21:00 JST)

on:
  schedule:
    - cron: '0 23 * * *'  # 08:00 JST
    - cron: '0 12 * * *'  # 21:00 JST
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: npm ci

      - name: Run auto-publish script
        run: python scripts/auto-publish-2030.py

      - name: Build Astro site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=fukugyousagiroku --branch=main

      - name: Commit logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/ approved/ || true
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 auto-publish [skip ci]"
          git push || echo "Nothing to push"
