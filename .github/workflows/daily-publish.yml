name: Daily Auto-Publish (20:30 JST)

on:
  schedule:
    # 毎日 11:30 UTC = 20:30 JST に発火
    - cron: '30 11 * * *'
  workflow_dispatch:  # 手動実行も可能

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install npm dependencies
        run: npm ci

      - name: Run auto-publish script
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TZ: Asia/Tokyo
        run: python scripts/auto-publish-2030.py

      - name: Commit publish log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/ || true
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 auto-publish $(date -u +%Y-%m-%d) [skip ci]"
          git push || echo "Nothing to push"
